version: "3"

vars:
  MIGRATIONS_DIR: ./migrations
  FRONTEND_DIR: ./web
  DB_URL: postgres://yusuf:123456@localhost:5435/iwifunni?sslmode=disable

tasks:
  # ----------------------------------
  # Main Targets
  # ----------------------------------

  dev:
    desc: Start backend dev server with Dockerized dependencies
    cmds:
      - task: db
      - air
      - echo "✅ Backend dev server running. Start the frontend separately with 'task web'."

  server:
    desc: Start backend dev server
    cmds:
      - task: db
      - air
      - echo "✅ Backend dev server running."
  web:
    desc: Start frontend
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm dev
      - echo "✅ All services running."

  worker:
    desc: Start workers
    cmds:
      - task: db
      - go run ./cmd/worker
      - echo "✅ Worker running."

  build:
    desc: Build app
    cmds:
      - go build -o ./iwifunni ./cmd/api
      - echo "✅ Build completed."

  db:
    desc: Start Dockerized DB + Redis
    cmds:
      - docker compose up -d
      - echo "✅ Postgres and Redis are up."

  lint:
    desc: Lint backend
    cmds:
      - golangci-lint run
      - echo "✅ Go linting completed."

  swagger:
    desc: Swagger task is stale
    cmds:
      - echo "Swagger generation is not configured for the current repo entrypoints."

  sqlc:
    desc: Generate sqlc queries
    cmds:
      - sqlc generate
      - echo "✅ Sqlc queries generated."

  # ----------------------------------
  # Migrations
  # ----------------------------------

  migrate:up:
    desc: Apply all pending migrations
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} postgres "{{.DB_URL}}" up

  migrate:down:
    desc: Rollback last migration
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} postgres "{{.DB_URL}}" down

  migrate:status:
    desc: Show migration status
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} postgres "{{.DB_URL}}" status

  migrate:new:
    desc: Create a new migration
    interactive: true
    cmds:
      - |
        read -p "Migration name: " name
        goose -dir {{.MIGRATIONS_DIR}} create "$name" sql

  # ----------------------------------
  # Tools
  # ----------------------------------

  tools:
    desc: Install dev tools
    cmds:
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - go install github.com/air-verse/air@latest
      - echo "✅ Dev tools installed."

  # ----------------------------------
  # Help
  # ----------------------------------

  help:
    desc: Show available tasks
    cmds:
      - task --list
