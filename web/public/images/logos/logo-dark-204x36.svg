<svg
  width="204"
  height="36"
  viewBox="0 0 204 36"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="grad" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g>
    <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#grad)"/>

    <!-- Rings -->
    <circle cx="18" cy="18" r="8" stroke="white" stroke-width="2.4" opacity="0.22"/>
    <circle cx="18" cy="18" r="12" stroke="white" stroke-width="1.8" opacity="0.14"/>

    <!-- Center -->
    <circle cx="18" cy="18" r="3.6" fill="white"/>

    <!-- Nodes -->
    <circle cx="18" cy="6.5" r="1.8" fill="white"/>
    <circle cx="29.5" cy="18" r="1.8" fill="white"/>
    <circle cx="18" cy="29.5" r="1.8" fill="white"/>
    <circle cx="6.5" cy="18" r="1.8" fill="white"/>

  </g>

  <!-- Text -->
  <text
    x="48"
    y="23"
    font-family="Inter, system-ui, sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#0F172A"
  >
    Iwifunni
