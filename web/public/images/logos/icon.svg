<svg width="140" height="140" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="140" height="140" rx="36" fill="url(#iconGrad)"/>

  <!-- Outer notification rings -->
  <circle cx="70" cy="70" r="38" stroke="white" stroke-width="10" opacity="0.22"/>
  <circle cx="70" cy="70" r="58" stroke="white" stroke-width="8" opacity="0.14"/>

  <!-- Center dot -->
  <circle cx="70" cy="70" r="18" fill="white"/>

  <!-- Signal dots (top, right, bottom, left) -->
  <circle cx="70" cy="16" r="8" fill="white"/>
  <circle cx="114" cy="70" r="8" fill="white"/>
  <circle cx="70" cy="124" r="8" fill="white"/>
  <circle cx="26" cy="70" r="8" fill="white"/>
</svg>
