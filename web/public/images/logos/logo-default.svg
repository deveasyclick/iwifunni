<svg width="720" height="220" viewBox="0 0 720 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="40" y1="40" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="220" y1="60" x2="620" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Icon -->
  <g filter="url(#shadow)">
    <!-- Outer rounded square -->
    <rect x="40" y="40" width="140" height="140" rx="36" fill="url(#grad)"/>

    <!-- Notification rings -->
    <circle cx="110" cy="110" r="38" stroke="white" stroke-width="10" opacity="0.22"/>
    <circle cx="110" cy="110" r="58" stroke="white" stroke-width="8" opacity="0.14"/>

    <!-- Central node -->
    <circle cx="110" cy="110" r="18" fill="white"/>

    <!-- Outgoing signal dots -->
    <circle cx="110" cy="52" r="8" fill="white"/>
    <circle cx="158" cy="110" r="8" fill="white"/>
    <circle cx="110" cy="168" r="8" fill="white"/>
    <circle cx="62" cy="110" r="8" fill="white"/>

    <!-- Connection lines -->
    <line x1="110" y1="70" x2="110" y2="92" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <line x1="128" y1="110" x2="150" y2="110" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="128" x2="110" y2="150" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="110" x2="92" y2="110" stroke="white" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Brand text -->
  <g>
    <text
      x="220"
      y="120"
      font-family="Inter, system-ui, sans-serif"
      font-size="44"
      font-weight="700"
      fill="url(#textGrad)"
      letter-spacing="-1.5"
    >
      Iwifunni
    </text>
  </g>
</svg>